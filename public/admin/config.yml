# ═══════════════════════════════════════════════════════════════
# DECAP CMS — Configuração do Painel de Conteúdo
# ═══════════════════════════════════════════════════════════════
# A editora acessa: https://castilloeng.com.br/admin/
# Edita APENAS texto de marketing por formulários, em português.
#
# Design do painel (decisão do dono, 2026-09-01):
#   - Objetos aninhados usam widget: object (nativo do Decap).
#     NÃO usar nomes pontuados (seo.title) — não implementado (issue #595).
#   - Os campos do config mapeiam 1:1 com as chaves do frontmatter de
#     cada .md (nível de topo). Nada de wrappers extras — o Decap
#     reescreve o frontmatter ao salvar e apagaria o que não está
#     declarado aqui.
#   - Campos avançados ficam em blocos colapsados no fim do formulário,
#     com required: false — preservados, fora do caminho da editora.
#   - Linguagem dos rótulos segue a convenção de CMS populares
#     (WordPress/Wix): nada de jargão de programação visível.
#   - Quem edita dados avançados: o dono, direto no .md via git.
# ═══════════════════════════════════════════════════════════════

backend:
  name: github
  repo: fernandocastillovicencio/castillo-engineering
  branch: main
  base_url: https://netlify-cms-github-oauth-provider-azure.vercel.app
  auth_endpoint: auth

locale: "pt_br"
site_url: "https://castilloeng.com.br"
media_folder: "public/images"
public_folder: "/images"

# ═══════════════════════════════════════════════════════════════
# COLECÕES — cada grupo de arquivos editáveis
# ═══════════════════════════════════════════════════════════════
collections:

  # ─────────────────────────────────────────────────────────────
  # 1. PÁGINA INICIAL (9 seções)
  # ─────────────────────────────────────────────────────────────
  - name: "inicio"
    label: "Página Inicial"
    description: "Seções da página inicial, na ordem em que aparecem"
    files:

      - name: "apresentacao"
        label: "1. Apresentação (topo)"
        file: "marketing/apresentacao.md"
        fields:
          - label: "Selo (2 itens)"
            name: "badge"
            widget: "list"
            hint: "Digite um item por linha e clique em adicionar"
          - label: "Linha de atendimento"
            name: "linhaAtendimento"
            widget: "string"
          - label: "Título"
            name: "headline"
            widget: "string"
          - label: "Subtítulo"
            name: "sub"
            widget: "text"
          - label: "SEO (Google) — avançado"
            name: "seo"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - {label: "Título da aba", name: "title", widget: "string", required: false}
              - {label: "Descrição para o Google", name: "description", widget: "text", required: false}
          - label: "Botão principal — NÃO troque o texto"
            name: "ctaPrincipal"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - {label: "Texto do botão", name: "label", widget: "string", hint: "Mantenha: Agendar conversa (sem compromisso)"}
              - {label: "Link (não altere)", name: "href", widget: "string", required: false}
          - label: "Botão secundário — técnico"
            name: "ctaSecundario"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - {label: "Texto do botão", name: "label", widget: "string", required: false}
              - {label: "Link (não altere)", name: "href", widget: "string", required: false}
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "oque-resolvemos"
        label: "2. O que resolvemos"
        file: "marketing/o-que-resolvemos.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Resumo"
            name: "intro"
            widget: "text"
          - label: "Camadas de problemas"
            name: "camadas"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título do bloco"
                name: "titulo"
                widget: "string"
              - label: "Subtítulo (ao lado do título)"
                name: "subtitulo"
                widget: "string"
              - label: "Tipo de lista"
                name: "tipo"
                widget: "select"
                options:
                  - { label: "Dores (3 colunas)", value: "dores" }
                  - { label: "Tags (palavras curtas)", value: "chips" }
              - label: "Itens"
                name: "itens"
                widget: "list"
                summary: "{{fields.dor}}{{fields.item}}"
                fields:
                  - label: "Problema (dores)"
                    name: "dor"
                    widget: "string"
                    required: false
                  - label: "Sintoma (dores)"
                    name: "sintoma"
                    widget: "string"
                    required: false
                  - label: "Impacto (dores)"
                    name: "impacto"
                    widget: "string"
                    required: false
                  - label: "Tag"
                    name: "item"
                    widget: "string"
                    required: false
              - label: "Título da nota (opcional)"
                name: "notaTitulo"
                widget: "string"
                required: false
              - label: "Nota (opcional)"
                name: "nota"
                widget: "text"
                required: false
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "como-funciona"
        label: "3. Como funciona"
        file: "marketing/como-funciona.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Resumo"
            name: "intro"
            widget: "text"
          - label: "Passos"
            name: "passos"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título do passo"
                name: "titulo"
                widget: "string"
              - label: "Detalhe (descrição)"
                name: "detalhe"
                widget: "text"
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "para-quem"
        label: "4. Para quem"
        file: "marketing/para-quem.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Resumo"
            name: "intro"
            widget: "text"
          - label: "Setores principais (cartões)"
            name: "setoresPrincipais"
            widget: "list"
            summary: "{{fields.setor}}"
            fields:
              - label: "Nome do setor"
                name: "setor"
                widget: "string"
              - label: "Frase"
                name: "frase"
                widget: "string"
          - label: "Setores secundários (tags)"
            name: "setoresMenores"
            widget: "list"
            hint: "Digite um setor por linha e clique em adicionar"
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "por-que"
        label: "5. Por que a Castillo"
        file: "marketing/por-que-a-castillo.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Diferenciais (3 cards)"
            name: "diferenciais"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Descrição"
                name: "descricao"
                widget: "text"
          - label: "Bloco 'Como trabalhamos'"
            name: "comoTrabalhamos"
            widget: "object"
            fields:
              - label: "Título do bloco"
                name: "titulo"
                widget: "string"
              - label: "Parágrafo 1"
                name: "paragrafo1"
                widget: "text"
              - label: "Parágrafo 2"
                name: "paragrafo2"
                widget: "text"
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "investimento"
        label: "6. Investimento"
        file: "marketing/investimento.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Resumo"
            name: "intro"
            widget: "text"
          - label: "Cards de serviços"
            name: "cards"
            widget: "list"
            summary: "{{fields.nome}}"
            fields:
              - label: "Nome"
                name: "nome"
                widget: "string"
              - label: "O que inclui"
                name: "inclui"
                widget: "string"
              - label: "Destacado? (azul)"
                name: "destaque"
                widget: "boolean"
                default: false
          - label: "Botão"
            name: "cta"
            widget: "object"
            fields:
              - label: "Texto do botão"
                name: "label"
                widget: "string"
                hint: "Mantenha: Agendar conversa (sem compromisso)"
              - label: "Link (não altere)"
                name: "href"
                widget: "string"
                required: false
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "perguntas-frequentes"
        label: "7. Perguntas Frequentes"
        file: "marketing/perguntas-frequentes.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Resumo"
            name: "intro"
            widget: "text"
          - label: "Perguntas e respostas"
            name: "faq"
            widget: "list"
            summary: "{{fields.pergunta}}"
            fields:
              - label: "Pergunta"
                name: "pergunta"
                widget: "string"
              - label: "Resposta"
                name: "resposta"
                widget: "text"
              - label: "Link (opcional)"
                name: "link"
                widget: "object"
                required: false
                fields:
                  - label: "Endereço do link"
                    name: "href"
                    widget: "string"
                    required: false
                  - label: "Texto do link"
                    name: "rotulo"
                    widget: "string"
                    required: false
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "resultados"
        label: "8. Resultados"
        file: "marketing/resultados.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Bloco de portfólio"
            name: "portifolio"
            widget: "object"
            fields:
              - label: "Título do bloco"
                name: "titulo"
                widget: "string"
              - label: "Resumo"
                name: "intro"
                widget: "text"
              - label: "Projetos"
                name: "itens"
                widget: "list"
                summary: "{{fields.titulo}}"
                fields:
                  - label: "Nome do projeto"
                    name: "titulo"
                    widget: "string"
                  - label: "Descrição"
                    name: "descricao"
                    widget: "text"
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "contato"
        label: "9. Contato"
        file: "marketing/contato.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Resumo"
            name: "intro"
            widget: "text"
          - label: "Aviso LGPD"
            name: "avisoLgpd"
            widget: "object"
            fields:
              - label: "Texto antes do link"
                name: "antes"
                widget: "string"
              - label: "Texto do link"
                name: "linkLabel"
                widget: "string"
              - label: "Link (não altere)"
                name: "linkHref"
                widget: "string"
                required: false
          - label: "Texto do botão de envio"
            name: "botao"
            widget: "string"
            hint: "Mantenha: Agendar conversa (sem compromisso)"
          - label: "Texto enquanto envia"
            name: "botaoEnviando"
            widget: "string"
          - label: "Mensagem de erro"
            name: "erroEnvio"
            widget: "string"
          - label: "Confirmação (após envio)"
            name: "confirmacao"
            widget: "object"
            fields:
              - label: "Título da confirmação"
                name: "titulo"
                widget: "string"
              - label: "Texto"
                name: "texto"
                widget: "text"
              - label: "Link pós-envio"
                name: "link"
                widget: "object"
                fields:
                  - label: "Link (não altere)"
                    name: "href"
                    widget: "string"
                    required: false
                  - label: "Texto do link"
                    name: "rotulo"
                    widget: "string"
          - label: "Chamada do WhatsApp direto"
            name: "whatsappDireto"
            widget: "object"
            fields:
              - label: "Texto antes"
                name: "antes"
                widget: "string"
              - label: "Texto do link"
                name: "linkLabel"
                widget: "string"
          - label: "Estrutura do formulário — avançado, NÃO ALTERE"
            name: "form"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - label: "Campos obrigatórios"
                name: "camposObrigatorios"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - {label: "Nome do campo (não altere)", name: "nome", widget: "string"}
                  - {label: "Rótulo", name: "label", widget: "string"}
                  - {label: "Tipo de campo", name: "tipo", widget: "string", required: false}
                  - {label: "Texto de exemplo (dentro do campo)", name: "placeholder", widget: "string", required: false}
                  - {label: "Opções (lista de escolhas)", name: "opcoes", widget: "list", required: false}
                  - {label: "Obrigatório?", name: "required", widget: "boolean", required: false}
              - label: "Seção complementar"
                name: "complementar"
                widget: "object"
                required: false
                fields:
                  - {label: "Título", name: "titulo", widget: "string"}
                  - label: "Campos"
                    name: "campos"
                    widget: "list"
                    required: false
                    summary: "{{fields.label}}"
                    fields:
                      - {label: "Nome do campo (não altere)", name: "nome", widget: "string"}
                      - {label: "Rótulo", name: "label", widget: "string"}
                      - {label: "Tipo de campo", name: "tipo", widget: "string", required: false}
                      - {label: "Texto de exemplo (dentro do campo)", name: "placeholder", widget: "string", required: false}
                      - {label: "Nº de linhas (caixa de texto)", name: "rows", widget: "number", required: false}
                      - {label: "Opções (lista de escolhas)", name: "opcoes", widget: "list", required: false}
              - {label: "Assunto do e-mail", name: "assunto", widget: "string", required: false}
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

  # ─────────────────────────────────────────────────────────────
  # 2. PÁGINAS INTERNAS
  # ─────────────────────────────────────────────────────────────
  - name: "paginas"
    label: "Páginas Internas"
    files:

      - name: "investimento-pagina"
        label: "Investimento (/prices)"
        file: "marketing/pagina-investimento.md"
        fields:
          - label: "Título"
            name: "h1"
            widget: "string"
          - label: "Resumo"
            name: "intro"
            widget: "text"
          - label: "Etapas"
            name: "etapas"
            widget: "list"
            summary: "Etapa {{fields.numero}} — {{fields.titulo}}"
            fields:
              - label: "Número"
                name: "numero"
                widget: "number"
                default: 1
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Texto"
                name: "texto"
                widget: "text"
              - label: "Texto em destaque (opcional)"
                name: "textoDestaque"
                widget: "string"
                required: false
              - label: "Prazo (opcional)"
                name: "prazo"
                widget: "string"
                required: false
              - label: "Destacado? (azul)"
                name: "destaque"
                widget: "boolean"
                default: false
              - label: "Cards de projeto (opcional, etapa 4)"
                name: "cards"
                widget: "list"
                required: false
                summary: "{{fields.nome}}"
                fields:
                  - label: "Nome do plano"
                    name: "nome"
                    widget: "string"
                  - label: "Descrição"
                    name: "texto"
                    widget: "text"
              - label: "Nota (opcional)"
                name: "nota"
                widget: "text"
                required: false
          - label: "Bloco 'Como precificamos'"
            name: "comoPrecificamos"
            widget: "object"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Pontos (3)"
                name: "pontos"
                widget: "list"
                summary: "{{fields.destaque}}"
                fields:
                  - label: "Texto em destaque"
                    name: "destaque"
                    widget: "string"
                  - label: "Explicação"
                    name: "texto"
                    widget: "text"
              - label: "Texto de risco"
                name: "risco"
                widget: "text"
          - label: "Botão"
            name: "cta"
            widget: "object"
            fields:
              - label: "Texto"
                name: "label"
                widget: "string"
                hint: "Mantenha: Agendar conversa (sem compromisso)"
              - label: "Link (não altere)"
                name: "href"
                widget: "string"
                required: false
          - label: "SEO (Google) — avançado"
            name: "seo"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - {label: "Título da aba", name: "title", widget: "string", required: false}
              - {label: "Descrição", name: "description", widget: "text", required: false}
          - label: "Palavra \"Prazo\" (texto fixo) — avançado"
            name: "prazoLabel"
            widget: "string"
            required: false
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "metodologia-pagina"
        label: "Metodologia (/methodology)"
        file: "marketing/pagina-metodologia.md"
        fields:
          - label: "Título"
            name: "h1"
            widget: "string"
          - label: "Resumo"
            name: "intro"
            widget: "text"
          - label: "Cards do método"
            name: "cards"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Texto"
                name: "texto"
                widget: "text"
          - label: "Botão"
            name: "cta"
            widget: "object"
            fields:
              - label: "Texto"
                name: "label"
                widget: "string"
                hint: "Mantenha: Agendar conversa (sem compromisso)"
              - label: "Link (não altere)"
                name: "href"
                widget: "string"
                required: false
          - label: "SEO (Google) — avançado"
            name: "seo"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - {label: "Título da aba", name: "title", widget: "string", required: false}
              - {label: "Descrição", name: "description", widget: "text", required: false}
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "404-pagina"
        label: "404 / Página não encontrada"
        file: "marketing/pagina-nao-encontrada.md"
        fields:
          - label: "Código (ex: 404)"
            name: "codigo"
            widget: "string"
          - label: "Texto principal"
            name: "textoPrincipal"
            widget: "string"
          - label: "Texto de detalhe"
            name: "textoDetalhe"
            widget: "string"
          - label: "Botões"
            name: "ctas"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - label: "Texto do botão"
                name: "label"
                widget: "string"
              - label: "Link (não altere)"
                name: "href"
                widget: "string"
                required: false
              - label: "Estilo"
                name: "estilo"
                widget: "select"
                options:
                  - { label: "Azul (principal)", value: "primario" }
                  - { label: "Contorno (secundário)", value: "secundario" }
          - label: "SEO (Google) — avançado"
            name: "seo"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - {label: "Título da aba", name: "title", widget: "string", required: false}
              - {label: "Descrição", name: "description", widget: "text", required: false}
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

      - name: "privacidade-pagina"
        label: "Privacidade LGPD (/privacy-lgpd)"
        file: "marketing/pagina-privacidade-lgpd.md"
        fields:
          - label: "Título"
            name: "h1"
            widget: "string"
          - label: "Data de atualização"
            name: "ultimaAtualizacao"
            widget: "string"
            hint: "ex: Última atualização: agosto de 2026."
          - label: "Conteúdo"
            name: "body"
            widget: "markdown"
            hint: "Edite os 9 blocos de texto jurídico. Use ## para títulos (seção 1, 2, etc.)"
          - label: "SEO (Google) — avançado"
            name: "seo"
            widget: "object"
            collapsed: true
            required: false
            fields:
              - {label: "Título da aba", name: "title", widget: "string", required: false}
              - {label: "Descrição", name: "description", widget: "text", required: false}
          - label: "Descrição da seção (uso interno)"
            name: "sobre"
            widget: "string"
            required: false

  # ─────────────────────────────────────────────────────────────
  # 3. CONFIGURAÇÕES GLOBAIS
  # ─────────────────────────────────────────────────────────────
  - name: "global"
    label: "Configurações Globais"
    files:

      - name: "rodape"
        label: "Rodapé"
        file: "marketing/rodape.md"
        fields:
          - label: "Chamada (com botão)"
            name: "cta"
            widget: "object"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Texto"
                name: "texto"
                widget: "text"
              - label: "Texto do botão"
                name: "label"
                widget: "string"
                hint: "Mantenha: Agendar conversa (sem compromisso)"
              - label: "Link do botão (não altere)"
                name: "href"
                widget: "string"
                required: false
          - label: "Colunas do rodapé"
            name: "colunas"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título da coluna"
                name: "titulo"
                widget: "string"
              - label: "Parágrafos (coluna 1)"
                name: "paragrafos"
                widget: "list"
                required: false
                hint: "Digite um parágrafo por linha e clique em adicionar"
              - label: "Links (coluna 2)"
                name: "links"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - label: "Texto do link"
                    name: "label"
                    widget: "string"
