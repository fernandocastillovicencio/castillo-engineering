      - name: "rodape"
        label: "Rodapé"
        file: "marketing/rodape.md"
        fields:
          - label: "Chamada (com botão)"
            name: "cta"
            widget: "object"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Texto"
                name: "texto"
                widget: "text"
              - label: "Botão — texto"
                name: "label"
                widget: "string"
                hint: "Mantenha: Agendar conversa (sem compromisso)"
              - label: "Endereço do botão (técnico)"
                name: "href"
                widget: "hidden"
                default: "/#contato"
          - label: "Colunas do rodapé"
            name: "colunas"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título da coluna"
                name: "titulo"
                widget: "string"
              - label: "Parágrafos (coluna 1)"
                name: "paragrafos"
                widget: "list"
                required: false
                hint: "Digite um parágrafo por linha e clique em adicionar"
              - label: "Links (coluna 2)"
                name: "links"
                widget: "list"
                required: false
                summary: "{{fields.label}}"
                fields:
                  - label: "Texto do link"
                    name: "label"
                    widget: "string"
                  - label: "URL"
                    name: "href"
                    widget: "string"
              - label: "Itens de contato (coluna 3)"
                name: "itens"
                widget: "list"
                required: false
                summary: "{{fields.label}}{{fields.item}}"
                fields:
                  - label: "Texto simples"
                    name: "item"
                    widget: "string"
                    required: false
                  - label: "Tipo (email, whatsapp)"
                    name: "tipo"
                    widget: "select"
                    required: false
                    options: ["email", "whatsapp"]
                  - label: "Rótulo (ex: contato@...)"
                    name: "label"
                    widget: "string"
                    required: false
          - label: "Linha de copyright"
            name: "copyright"
            widget: "string"