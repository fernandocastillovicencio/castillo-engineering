# ═══════════════════════════════════════════════════════════════
# DECAP CMS — Configuração do Painel de Conteúdo
# ═══════════════════════════════════════════════════════════════
# A editora acessa: https://castilloeng.com.br/admin/
# E edita TODOS os textos por formulários — sem ver YAML nem Markdown.
#
# ⚠️ PREENCHA ESTES DADOS ANTES DE USAR (instruções no ADMIN-README.md):
backend:
  name: github
  repo: SEU-USUARIO/SEU-REPOSITORIO
  branch: main
  base_url: https://castillo-cms-auth.vercel.app
  auth_endpoint: api/auth

locale: "pt_br"
site_url: "https://castilloeng.com.br"
media_folder: "public/images"
public_folder: "/images"

# ═══════════════════════════════════════════════════════════════
# COLECÕES — cada grupo de arquivos editáveis
# ═══════════════════════════════════════════════════════════════
collections:
  # ─────────────────────────────────────────────────────────────
  # 1. PÁGINA INICIAL (9 seções)
  # ─────────────────────────────────────────────────────────────
  - name: "inicio"
    label: "Página Inicial"
    description: "Seções da página inicial, na ordem em que aparecem"
    files:
      - name: "apresentacao"
        label: "1. Apresentação (topo)"
        file: "marketing/apresentacao.md"
        fields:
          - label: "Título da aba do navegador (SEO)"
            name: "seo.title"
            widget: "string"
          - label: "Descrição para o Google (SEO)"
            name: "seo.description"
            widget: "text"
          - label: "Selo (2 itens)"
            name: "badge"
            widget: "list"
            hint: "Digite um item por linha e clique em adicionar"
          - label: "Linha de atendimento"
            name: "linhaAtendimento"
            widget: "string"
          - label: "TÍTULO PRINCIPAL (headline)"
            name: "headline"
            widget: "string"
          - label: "Subtítulo"
            name: "sub"
            widget: "text"
          - label: "Botão principal — NÃO troque o texto"
            name: "ctaPrincipal.label"
            widget: "string"
            hint: "Mantenha: Agendar conversa (sem compromisso)"
          - label: "Link do botão principal (técnico)"
            name: "ctaPrincipal.href"
            widget: "hidden"
            default: "#contato"
          - label: "Botão secundário"
            name: "ctaSecundario.label"
            widget: "string"
          - label: "Link do botão secundário (técnico)"
            name: "ctaSecundario.href"
            widget: "hidden"
            default: "#o-que-resolvemos"

      - name: "oque-resolvemos"
        label: "2. O que resolvemos"
        file: "marketing/o-que-resolvemos.md"
        fields:
          - label: "Título da seção"
            name: "title"
            widget: "string"
          - label: "Parágrafo de introdução"
            name: "intro"
            widget: "text"
          - label: "Camadas de problemas"
            name: "camadas"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título do bloco"
                name: "titulo"
                widget: "string"
              - label: "Subtítulo (ao lado do título)"
                name: "subtitulo"
                widget: "string"
              - label: "Tipo de lista"
                name: "tipo"
                widget: "select"
                options:
                  - { label: "Dores (3 colunas)", value: "dores" }
                  - { label: "Chips (tags)", value: "chips" }
              - label: "Itens"
                name: "itens"
                widget: "list"
                summary: "{{fields.dor}}{{fields.item}}"
                fields:
                  - label: "Problema (dores)"
                    name: "dor"
                    widget: "string"
                    required: false
                  - label: "Sintoma (dores)"
                    name: "sintoma"
                    widget: "string"
                    required: false
                  - label: "Impacto (dores)"
                    name: "impacto"
                    widget: "string"
                    required: false
                  - label: "Texto do chip (chips)"
                    name: "item"
                    widget: "string"
                    required: false
              - label: "Título da nota (opcional)"
                name: "notaTitulo"
                widget: "string"
                required: false
              - label: "Nota (opcional)"
                name: "nota"
                widget: "text"
                required: false

      - name: "como-funciona"
        label: "3. Como funciona"
        file: "marketing/como-funciona.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Introdução"
            name: "intro"
            widget: "text"
          - label: "Passos"
            name: "passos"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título do passo"
                name: "titulo"
                widget: "string"
              - label: "Detalhe (descrição)"
                name: "detalhe"
                widget: "text"

      - name: "para-quem"
        label: "4. Para quem"
        file: "marketing/para-quem.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Introdução"
            name: "intro"
            widget: "text"
          - label: "Setores principais (cards)"
            name: "setoresPrincipais"
            widget: "list"
            summary: "{{fields.setor}}"
            fields:
              - label: "Nome do setor"
                name: "setor"
                widget: "string"
              - label: "Frase"
                name: "frase"
                widget: "string"
          - label: "Setores secundários (tags)"
            name: "setoresMenores"
            widget: "list"
            hint: "Digite um setor por linha e clique em adicionar"

      - name: "por-que"
        label: "5. Por que a Castillo"
        file: "marketing/por-que-a-castillo.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Diferenciais (3 cards)"
            name: "diferenciais"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Descrição"
                name: "descricao"
                widget: "text"
          - label: "Bloco 'Como trabalhamos'"
            name: "comoTrabalhamos"
            widget: "object"
            fields:
              - label: "Título do bloco"
                name: "titulo"
                widget: "string"
              - label: "Parágrafo 1"
                name: "paragrafo1"
                widget: "text"
              - label: "Parágrafo 2"
                name: "paragrafo2"
                widget: "text"

      - name: "investimento"
        label: "6. Investimento"
        file: "marketing/investimento.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Introdução"
            name: "intro"
            widget: "text"
          - label: "Cards de serviços"
            name: "cards"
            widget: "list"
            summary: "{{fields.nome}}"
            fields:
              - label: "Nome"
                name: "nome"
                widget: "string"
              - label: "O que inclui"
                name: "inclui"
                widget: "string"
              - label: "Destacado? (azul)"
                name: "destaque"
                widget: "boolean"
                default: false
          - label: "Botão CTA"
            name: "cta"
            widget: "object"
            fields:
              - label: "Texto do botão"
                name: "label"
                widget: "string"
                hint: "Mantenha: Agendar conversa (sem compromisso)"
              - label: "Endereço (técnico)"
                name: "href"
                widget: "hidden"
                default: "#contato"

      - name: "perguntas-frequentes"
        label: "7. Perguntas Frequentes"
        file: "marketing/perguntas-frequentes.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Introdução"
            name: "intro"
            widget: "text"
          - label: "Perguntas e respostas"
            name: "faq"
            widget: "list"
            summary: "{{fields.pergunta}}"
            fields:
              - label: "Pergunta"
                name: "pergunta"
                widget: "string"
              - label: "Resposta"
                name: "resposta"
                widget: "text"
              - label: "Link (opcional)"
                name: "link"
                widget: "object"
                required: false
                fields:
                  - label: "URL do link"
                    name: "href"
                    widget: "string"
                  - label: "Texto do link"
                    name: "rotulo"
                    widget: "string"

      - name: "resultados"
        label: "8. Resultados"
        file: "marketing/resultados.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Bloco de portfólio"
            name: "portifolio"
            widget: "object"
            fields:
              - label: "Título do bloco"
                name: "titulo"
                widget: "string"
              - label: "Introdução"
                name: "intro"
                widget: "text"
              - label: "Projetos"
                name: "itens"
                widget: "list"
                summary: "{{fields.titulo}}"
                fields:
                  - label: "Nome do projeto"
                    name: "titulo"
                    widget: "string"
                  - label: "Descrição"
                    name: "descricao"
                    widget: "text"

      - name: "contato"
        label: "9. Contato"
        file: "marketing/contato.md"
        fields:
          - label: "Título"
            name: "title"
            widget: "string"
          - label: "Introdução"
            name: "intro"
            widget: "text"
          - label: "Campos obrigatórios do formulário"
            name: "form.camposObrigatorios"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - label: "Identificador técnico (não altere)"
                name: "nome"
                widget: "string"
                hint: "⚠️ Não altere — é o nome do campo no formulário"
              - label: "Rótulo (ex: Nome *)"
                name: "label"
                widget: "string"
              - label: "Tipo de campo"
                name: "tipo"
                widget: "select"
                options: ["text", "tel", "email", "select", "textarea"]
                default: "text"
              - label: "Texto de exemplo"
                name: "placeholder"
                widget: "string"
              - label: "Opções (só para select)"
                name: "opcoes"
                widget: "list"
                required: false
              - label: "Obrigatório?"
                name: "required"
                widget: "boolean"
                default: true
          - label: "Seção complementar (opcional)"
            name: "form.complementar"
            widget: "object"
            fields:
              - label: "Título da seção"
                name: "titulo"
                widget: "string"
              - label: "Campos complementares"
                name: "campos"
                widget: "list"
                summary: "{{fields.label}}"
                fields:
                  - label: "Identificador técnico (não altere)"
                    name: "nome"
                    widget: "string"
                    hint: "⚠️ Não altere — é o nome do campo no formulário"
                  - label: "Rótulo"
                    name: "label"
                    widget: "string"
                  - label: "Tipo"
                    name: "tipo"
                    widget: "select"
                    options: ["text", "tel", "email", "select", "textarea"]
                    default: "text"
                  - label: "Placeholder"
                    name: "placeholder"
                    widget: "string"
                  - label: "Nº de linhas (só textarea)"
                    name: "rows"
                    widget: "number"
                    required: false
                    default: 2
                  - label: "Opções (só para select)"
                    name: "opcoes"
                    widget: "list"
                    required: false
          - label: "Assunto do e-mail (técnico)"
            name: "form.assunto"
            widget: "hidden"
            default: "Novo contato — site Castillo Engenharia"
          - label: "Aviso LGPD"
            name: "avisoLgpd"
            widget: "object"
            fields:
              - label: "Texto antes do link"
                name: "antes"
                widget: "string"
              - label: "Texto do link"
                name: "linkLabel"
                widget: "string"
              - label: "Endereço do link (técnico)"
                name: "linkHref"
                widget: "hidden"
                default: "/privacy-lgpd"
          - label: "Texto do botão de envio"
            name: "botao"
            widget: "string"
            hint: "Mantenha: Agendar conversa (sem compromisso)"
          - label: "Texto enquanto envia"
            name: "botaoEnviando"
            widget: "string"
          - label: "Mensagem de erro"
            name: "erroEnvio"
            widget: "string"
          - label: "Confirmação (após envio)"
            name: "confirmacao"
            widget: "object"
            fields:
              - label: "Título da confirmação"
                name: "titulo"
                widget: "string"
              - label: "Texto"
                name: "texto"
                widget: "text"
              - label: "Link"
                name: "link"
                widget: "object"
                fields:
                  - label: "Endereço do link (técnico)"
                    name: "href"
                    widget: "hidden"
                    default: "/methodology"
                  - label: "Texto do link"
                    name: "rotulo"
                    widget: "string"
          - label: "Chamada do WhatsApp direto"
            name: "whatsappDireto"
            widget: "object"
            fields:
              - label: "Texto antes"
                name: "antes"
                widget: "string"
              - label: "Texto do link"
                name: "linkLabel"
                widget: "string"

  # ─────────────────────────────────────────────────────────────
  # 2. PÁGINAS INTERNAS
  # ─────────────────────────────────────────────────────────────
  - name: "paginas"
    label: "Páginas Internas"
    files:
      - name: "investimento-pagina"
        label: "Investimento (/prices)"
        file: "marketing/pagina-investimento.md"
        fields:
          - label: "Rótulo do prazo (técnico)"
            name: "prazoLabel"
            widget: "hidden"
            default: "Prazo:"
          - label: "Título da aba (SEO)"
            name: "seo.title"
            widget: "string"
          - label: "Descrição (SEO)"
            name: "seo.description"
            widget: "text"
          - label: "Título principal (h1)"
            name: "h1"
            widget: "string"
          - label: "Introdução"
            name: "intro"
            widget: "text"
          - label: "Etapas"
            name: "etapas"
            widget: "list"
            summary: "Etapa {{fields.numero}} — {{fields.titulo}}"
            fields:
              - label: "Número"
                name: "numero"
                widget: "number"
                default: 1
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Texto"
                name: "texto"
                widget: "text"
              - label: "Texto em destaque (opcional)"
                name: "textoDestaque"
                widget: "string"
                required: false
              - label: "Prazo (opcional)"
                name: "prazo"
                widget: "string"
                required: false
              - label: "Destacado? (azul)"
                name: "destaque"
                widget: "boolean"
                default: false
              - label: "Cards de projeto (opcional, etapa 4)"
                name: "cards"
                widget: "list"
                required: false
                summary: "{{fields.nome}}"
                fields:
                  - label: "Nome do plano"
                    name: "nome"
                    widget: "string"
                  - label: "Descrição"
                    name: "texto"
                    widget: "text"
              - label: "Nota (opcional)"
                name: "nota"
                widget: "text"
                required: false
          - label: "Bloco 'Como precificamos'"
            name: "comoPrecificamos"
            widget: "object"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Pontos (3)"
                name: "pontos"
                widget: "list"
                summary: "{{fields.destaque}}"
                fields:
                  - label: "Texto em destaque"
                    name: "destaque"
                    widget: "string"
                  - label: "Explicação"
                    name: "texto"
                    widget: "text"
              - label: "Texto de risco"
                name: "risco"
                widget: "text"
          - label: "Botão CTA"
            name: "cta"
            widget: "object"
            fields:
              - label: "Texto"
                name: "label"
                widget: "string"
                hint: "Mantenha: Agendar conversa (sem compromisso)"
              - label: "Endereço (técnico)"
                name: "href"
                widget: "hidden"
                default: "/#contato"

      - name: "metodologia-pagina"
        label: "Metodologia (/methodology)"
        file: "marketing/pagina-metodologia.md"
        fields:
          - label: "Título da aba (SEO)"
            name: "seo.title"
            widget: "string"
          - label: "Descrição (SEO)"
            name: "seo.description"
            widget: "text"
          - label: "Título principal (h1)"
            name: "h1"
            widget: "string"
          - label: "Introdução"
            name: "intro"
            widget: "text"
          - label: "Cards do método"
            name: "cards"
            widget: "list"
            summary: "{{fields.titulo}}"
            fields:
              - label: "Título"
                name: "titulo"
                widget: "string"
              - label: "Texto"
                name: "texto"
                widget: "text"
          - label: "Botão CTA"
            name: "cta"
            widget: "object"
            fields:
              - label: "Texto"
                name: "label"
                widget: "string"
                hint: "Mantenha: Agendar conversa (sem compromisso)"
              - label: "Endereço (técnico)"
                name: "href"
                widget: "hidden"
                default: "/#contato"

      - name: "404-pagina"
        label: "404 / Página não encontrada"
        file: "marketing/pagina-nao-encontrada.md"
        fields:
          - label: "Título da aba (SEO)"
            name: "seo.title"
            widget: "string"
          - label: "Descrição (SEO)"
            name: "seo.description"
            widget: "text"
          - label: "Código (ex: 404)"
            name: "codigo"
            widget: "string"
          - label: "Texto principal"
            name: "textoPrincipal"
            widget: "string"
          - label: "Texto de detalhe"
            name: "textoDetalhe"
            widget: "string"
          - label: "Botões"
            name: "ctas"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - label: "Texto do botão"
                name: "label"
                widget: "string"
              - label: "Endereço (técnico)"
                name: "href"
                widget: "hidden"
                default: "/"
              - label: "Estilo"
                name: "estilo"
                widget: "select"
                options: ["primario", "secundario"]

      - name: "privacidade-pagina"
        label: "Privacidade LGPD (/privacy-lgpd)"
        file: "marketing/pagina-privacidade-lgpd.md"
        fields:
          - label: "Título da aba (SEO)"
            name: "seo.title"
            widget: "string"
          - label: "Descrição (SEO)"
            name: "seo.description"
            widget: "text"
          - label: "Título principal (h1)"
            name: "h1"
            widget: "string"
          - label: "Data de atualização"
            name: "ultimaAtualizacao"
            widget: "string"
            hint: "ex: Última atualização: agosto de 2026."
          - label: "Texto legal completo"
            name: "body"
            widget: "markdown"
            hint: "Edite os 9 blocos de texto jurídico. Use ## para títulos (seção 1, 2, etc.)"

  # ─────────────────────────────────────────────────────────────
  # 3. CONFIGURAÇÕES GLOBAIS
  # ─────────────────────────────────────────────────────────────
  - name: "global"
    label: "Configurações Globais"
    files:
      - name: "configuracao-site"
        label: "Configuração do site"
        file: "marketing/configuracao-do-site.md"
        description: "⚠️ Altere com cuidado — dados técnicos do site inteiro"
        fields:
          - label: "URL do site (técnico)"
            name: "siteUrl"
            widget: "hidden"
            default: "https://castilloeng.com.br"
          - label: "Endpoint do formulário (técnico — não altere)"
            name: "formspree.endpoint"
            widget: "hidden"
            default: "https://formspree.io/f/mqernvvb"
          - label: "Texto do link 'pular conteúdo' (técnico)"
            name: "a11y.skipLink"
            widget: "hidden"
            default: "Pular para o conteúdo"
          - label: "Texto alternativo do logo (técnico)"
            name: "header.logoAlt"
            widget: "hidden"
            default: "Logo da Castillo Engenharia"
          - label: "Descrição do logo (técnico)"
            name: "header.logoAria"
            widget: "hidden"
            default: "Castillo Engenharia — página inicial"
          - label: "Botão WhatsApp do topo (técnico)"
            name: "header.ctaWhatsAppMobile"
            widget: "hidden"
            default: "WhatsApp"
          - label: "Acessibilidade botão WhatsApp (técnico)"
            name: "header.ctaWhatsAppMobileAria"
            widget: "hidden"
            default: "Conversar no WhatsApp"
          - label: "Botão agendar — celular (técnico)"
            name: "header.ctaPrincipalMobile"
            widget: "hidden"
            default: "Agendar conversa"
          - label: "Botão agendar — desktop (técnico)"
            name: "header.ctaPrincipalDesktop"
            widget: "hidden"
            default: "Agendar conversa (sem compromisso)"
          - label: "Número do WhatsApp (técnico)"
            name: "whatsapp.number"
            widget: "hidden"
            default: "5541933009505"
          - label: "Mensagem padrão do WhatsApp (técnico)"
            name: "whatsapp.mensagemAgendar"
            widget: "hidden"
          - label: "Mensagem do WhatsApp 404 (técnico)"
            name: "whatsapp.mensagem404"
            widget: "hidden"
          - label: "Acessibilidade botão flutuante (técnico)"
            name: "whatsappButton.ariaLabel"
            widget: "hidden"
            default: "Conversa de 30 minutos, sem compromisso"
          - label: "Texto do botão WhatsApp flutuante"
            name: "whatsappButton.textoDesktop"
            widget: "string"
            hint: "Texto visível no botão verde flutuante"
          - label: "Descrição padrão do site (SEO)"
            name: "meta.descriptionDefault"
            widget: "text"
          - label: "E-mail de contato"
            name: "contato.email"
            widget: "string"
          - label: "Telefone"
            name: "contato.telefone"
            widget: "string"
          - label: "CNPJ"
            name: "contato.cnpj"
            widget: "string"
          - label: "CEP / Cidade"
            name: "contato.cep"
            widget: "string"
          - label: "Nome fantasia"
            name: "institucional.nomeFantasia"
            widget: "string"
          - label: "Dados técnicos para o Google (Schema.org) — não altere"
            name: "schemaOrg.@type"
            widget: "hidden"
            default: "ProfessionalService"
          - label: "Nome legal (técnico)"
            name: "schemaOrg.legalName"
            widget: "hidden"
            default: "Castillo Engineering LTDA"
          - label: "Descrição (técnico)"
            name: "schemaOrg.description"
            widget: "hidden"
          - label: "Cidade (técnico)"
            name: "schemaOrg.addressLocality"
            widget: "hidden"
            default: "Curitiba"
          - label: "Estado (técnico)"
            name: "schemaOrg.addressRegion"
            widget: "hidden"
            default: "PR"
          - label: "CEP (técnico)"
            name: "schemaOrg.postalCode"
            widget: "hidden"
            default: "81510-210"
          - label: "País (técnico)"
            name: "schemaOrg.addressCountry"
            widget: "hidden"
